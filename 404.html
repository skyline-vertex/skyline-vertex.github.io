<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Skyline — 页面迁移</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    font-family: -apple-system, "SF Pro Display", "Segoe UI", "Microsoft YaHei", sans-serif;
    background: radial-gradient(120% 120% at 20% 10%, #eef2f7 0%, #dfe6ef 45%, #cdd7e4 100%);
    color: #12151c;
  }
  .card {
    position: relative; overflow: hidden;
    padding: 40px 44px; border-radius: 22px; max-width: 560px; width: calc(100% - 40px);
    background: rgba(255, 255, 255, .52);
    border: 1px solid rgba(255, 255, 255, .7);
    box-shadow: 0 24px 60px rgba(20, 30, 50, .16), inset 0 1px 0 rgba(255, 255, 255, .8);
    backdrop-filter: blur(22px) saturate(1.5);
    -webkit-backdrop-filter: blur(22px) saturate(1.5);
  }
  .card::after {
    content: ""; position: absolute; inset: -40% -20% auto auto; width: 260px; height: 260px;
    border-radius: 50%; filter: blur(60px); opacity: .5;
    background: conic-gradient(from 210deg, #7fb2ff, #c3a6ff, #79e6d6, #7fb2ff);
  }
  h1 { margin: 0 0 10px; font-size: 22px; letter-spacing: .02em; position: relative; }
  p { margin: 0 0 6px; font-size: 14px; line-height: 1.7; color: #3a4250; position: relative; }
  .en { font-size: 12.5px; color: #66707f; }
  a { color: #14509e; text-decoration: none; border-bottom: 1px solid rgba(20, 80, 158, .3); }
  code { font-size: 12px; background: rgba(18, 21, 28, .06); padding: 1px 6px; border-radius: 6px; }
  .bar { margin-top: 18px; height: 2px; border-radius: 2px; background: rgba(18,21,28,.1); overflow: hidden; position: relative; }
  .bar i { display: block; height: 100%; width: 40%; border-radius: 2px; background: linear-gradient(90deg, #7fb2ff, #c3a6ff); animation: sl 1.1s ease-in-out infinite; }
  @keyframes sl { 0% { transform: translateX(-100%); } 100% { transform: translateX(300%); } }
</style>
<meta http-equiv="refresh" content="2; url=/">
</head>
<body>
  <div class="card">
    <h1>正在带你回主站 · Redirecting</h1>
    <p>这个地址是旧的路径写法。本站全部 140 个页面走哈希路由，正确形式是 <code>/#/关于页/</code>。</p>
    <p class="en">This path has moved. All 140 pages of this site live behind hash routing — sending you to the homepage.</p>
    <p style="margin-top:14px">若浏览器未自动跳转，请点：<a href="/">Skyline 首页 · Home</a></p>
    <div class="bar"><i></i></div>
  </div>
<script>
  /* 本站是纯哈希路由：把误访的路径尽量还原成对应页面，保留访客意图 */
  (function () {
    var p = (location.pathname || '/').replace(/^\/+|\/+$/g, '');
    var known = /^(os|models|autopilot|ide|technology|services|support|store|developers|news|resources|about|legal)(\/|$)/;
    var target = p && known.test(p) ? '/#/' + p + '/' : '/#/';
    setTimeout(function () { location.replace(target); }, 1200);
  })();
</script>
</body>
</html>
